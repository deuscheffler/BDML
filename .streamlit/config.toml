# Tema oscuro/cian derivado del logo GDLM, para que los widgets nativos de
# Streamlit (selectbox, date_input, checkbox, dataframe, etc.) combinen con
# el CSS personalizado de app.py en vez de quedar en tema claro por defecto.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121A2E"
textColor = "#E7ECF7"
font = "sans serif"
